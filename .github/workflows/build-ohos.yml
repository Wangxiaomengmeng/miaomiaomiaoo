name: Build OpenHarmony (Small System)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 拉满 6 小时

    steps:
      - name: Setup Swap and Check Space
        run: |
          df -h /
          sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl python3 python3-pip \
            rsync unzip flex bison dosfstools mtools libssl-dev

      # ======== 缓存源码，避免重复拉取 ========
      - name: Cache OpenHarmony Source
        uses: actions/cache@v4
        with:
          path: /home/runner/openharmony
          key: ohos-source-v3.2-Release-${{ github.run_id }}
          restore-keys: |
            ohos-source-v3.2-Release-
      # ============================================

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OpenHarmony Source
        run: |
          mkdir -p /home/runner/openharmony
          cd /home/runner/openharmony
          
          # 如果目录已经被缓存下来了，这里会秒过
          if [ ! -d ".repo" ]; then
            repo init -u https://gitee.com/openharmony/manifest.git -b OpenHarmony-3.2-Release --no-repo-verify
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags || \
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          else
            echo "Found cached source, skipping repo sync!"
          fi
          
          ./build/prebuilts_download.sh

      - name: Build OpenHarmony (qemu-arm-linux-min)
        shell: bash
        run: |
          cd /home/runner/openharmony
          
          # 绕过系统版本检查（把系统伪装成 20.04）
          sudo sed -i 's/VERSION_ID="22.04"/VERSION_ID="20.04"/' /etc/os-release
          
          # 修正编译参数：OpenHarmony 不支持 -j4，正确参数是 --jobs=4
          ./build.sh --product-name qemu-arm-linux-min --ccache --jobs=4

      # ======== 修复后的产物收集：暴力搜索 ========
      - name: Collect artifacts
        if: always()
        run: |
          cd /home/runner/openharmony
          mkdir -p out_artifacts
          
          echo "=== Searching for all images and kernel ==="
          # 暴力搜刮所有的镜像、内核和二进制
          find out -name "*.img" -exec cp {} out_artifacts/ \;
          find out -name "zImage*" -exec cp {} out_artifacts/ \;
          find out -name "OHOS_Image.bin" -exec cp {} out_artifacts/ \;
          find out -name "uImage" -exec cp {} out_artifacts/ \;
          
          # 带上编译日志
          cp out/qemu-arm-linux/build.log out_artifacts/ 2>/dev/null || true
          
          echo "=== Artifacts ready ==="
          ls -lh out_artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ohos-qemu-images
          path: out_artifacts/
      # ============================================