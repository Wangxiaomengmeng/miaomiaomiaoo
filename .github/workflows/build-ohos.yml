name: Build OpenHarmony (Small System)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 拉满 6 小时

    steps:
      - name: Maximize build space (清理无用软件)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs curl python3 python3-pip \
            rsync unzip flex bison dosfstools mtools libssl-dev

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OpenHarmony Source
        run: |
          mkdir -p /home/runner/openharmony
          cd /home/runner/openharmony
          
          # 使用 3.2 Release 分支，比较稳定
          repo init -u https://gitee.com/openharmony/manifest.git -b OpenHarmony-3.2-Release --no-repo-verify
          
          # 同步代码（加 --fail-fast 防止卡死，如果失败会自动重试一次）
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags || \
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          
          # 下载预编译工具链（大约 2GB）
          ./build/prebuilts_download.sh

      - name: Build OpenHarmony (Small System - QEMU)
        run: |
          cd /home/runner/openharmony
          # 编译 QEMU 运行的 arm 模拟器版本 (小型系统)
          # 注意：-j4 不要开太大，防止内存爆掉
          ./build.sh --product-name qemu-arm-linux-min --ccache -j4

      - name: Collect artifacts
        run: |
          mkdir -p out_artifacts
          # qemu-arm-linux-min 的产物路径
          cp -r /home/runner/openharmony/out/qemu-arm-linux-min/packages/phone/images/* out_artifacts/ || \
          echo "Artifact path not found, checking..."
          
          ls -lh out_artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ohos-qemu-images
          path: out_artifacts/