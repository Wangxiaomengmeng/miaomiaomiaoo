name: Build Static Opkg

on:
  workflow_dispatch:

jobs:
  build-opkg:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install deps
        run: |
          apk update
          apk add build-base cmake git libarchive-dev openssl-dev zlib-dev

      - name: Clone opkg
        run: |
          git clone https://git.openwrt.org/project/opkg-lede.git

      - name: Build static opkg
        run: |
          cd opkg-lede
          mkdir build && cd build
          # 加上 CMAKE_POLICY_VERSION_MINIMUM 兼容旧脚本，同时关掉 BUILD_TESTING
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DWITH_CURL=OFF \
            -DWITH_GPG=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_TESTING=OFF
          make -j$(nproc)

      - name: Find and Copy binary
        run: |
          cd opkg-lede
          # 找到编译出来的 opkg 文件并复制出来
          find . -name opkg -type f -executable -exec cp {} ./opkg \;
          ls -lh opkg

      - name: Upload opkg
        uses: actions/upload-artifact@v4
        with:
          name: opkg-static
          path: opkg-lede/opkg