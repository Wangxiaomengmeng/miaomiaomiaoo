name: Build Static Opkg

on:
  workflow_dispatch:

jobs:
  build-opkg:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install deps
        run: |
          apk update
          apk add build-base cmake git libarchive-dev openssl-dev \
                  zlib-dev json-c-dev

      - name: Clone libubox
        run: |
          git clone https://git.openwrt.org/project/libubox.git

      - name: Build libubox static
        run: |
          cd libubox
          mkdir build && cd build
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_LUA=OFF \
            -DBUILD_EXAMPLES=OFF
          make -j$(nproc)
          make install
          ls -l /usr/lib/libubox.a
          ls -l /usr/include/libubox/

      - name: Clone opkg
        run: |
          git clone https://git.openwrt.org/project/opkg-lede.git

      - name: Build static opkg
        run: |
          cd opkg-lede
          mkdir build && cd build
          cmake .. \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH=/usr \
            -Dubox_LIBRARY=/usr/lib/libubox.a \
            -Dubox_INCLUDE_DIR=/usr/include
          make -j$(nproc)

      - name: Copy binary
        run: |
          cd opkg-lede
          find . -name opkg -type f -executable -exec cp {} ./opkg \;
          ls -lh opkg
          file opkg || true

      - name: Upload opkg
        uses: actions/upload-artifact@v4
        with:
          name: opkg-static
          path: opkg-lede/opkg