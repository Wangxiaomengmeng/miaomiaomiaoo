name: Build Tiny Linux (locked root + integrity check)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev cpio wget xz-utils e2fsprogs

      # ==================== BusyBox ====================
      - name: Download busybox
        run: |
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xf busybox-1.36.1.tar.bz2

      - name: Build busybox static
        run: |
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_SU=y/# CONFIG_SU is not set/' .config
          sed -i 's/^CONFIG_FEATURE_SU=y/# CONFIG_FEATURE_SU is not set/' .config
          make oldconfig
          make -j$(nproc)
          make install

      # ==================== OpenWrt rootfs ====================
      - name: Download OpenWrt rootfs
        run: |
          cd /tmp
          wget -q -O owrt.tar.gz \
            http://downloads.openwrt.org/releases/23.05.2/targets/x86/64/openwrt-23.05.2-x86-64-rootfs.tar.gz
          mkdir -p owrt
          tar -xzf owrt.tar.gz -C owrt
          echo ">>> Looking for opkg in OpenWrt rootfs:"
          find /tmp/owrt -type f -name opkg 2>/dev/null
          echo ">>> /tmp/owrt/lib contents:"
          ls -l /tmp/owrt/lib/ | head -30

      # ==================== system.img ====================
      - name: Build system image
        run: |
          set -e
          dd if=/dev/zero of=system.img bs=1M count=256
          mkfs.ext4 -F system.img
          sudo mkdir -p /mnt/sys
          sudo mount -o loop system.img /mnt/sys

          sudo cp -a busybox-1.36.1/_install/* /mnt/sys/
          sudo mkdir -p /mnt/sys/{proc,sys,dev,etc,sbin,bin,usr/bin,usr/lib,usr/share/udhcpc,var,lib,home,opt,root,tmp}
          sudo mkdir -p /mnt/sys/home/user

          sudo cp busybox-1.36.1/examples/udhcp/simple.script \
                  /mnt/sys/usr/share/udhcpc/default.script
          sudo chmod +x /mnt/sys/usr/share/udhcpc/default.script

          # ---- musl 库 ----
          sudo cp -a /tmp/owrt/lib/*.so* /mnt/sys/lib/ 2>/dev/null || true
          sudo cp -a /tmp/owrt/usr/lib/*.so* /mnt/sys/usr/lib/ 2>/dev/null || true
          sudo rm -f /mnt/sys/lib/ld-musl-x86_64.so.1
          sudo ln -sf /lib/libc.so /mnt/sys/lib/ld-musl-x86_64.so.1

          # ---- opkg（find 定位，兼容不同版本路径）----
          OPKG_BIN=$(find /tmp/owrt -type f -name opkg 2>/dev/null | head -1)
          if [ -z "$OPKG_BIN" ]; then
              echo "ERROR: opkg binary not found in OpenWrt rootfs"
              echo "Searching for opkg-like files:"
              find /tmp/owrt -name 'opkg*' 2>/dev/null
              find /tmp/owrt -type f -perm -u+x 2>/dev/null | grep -E '/(opkg|apk)$' || true
              exit 1
          fi
          echo ">>> Found opkg at: $OPKG_BIN"
          sudo cp "$OPKG_BIN" /mnt/sys/usr/bin/opkg
          sudo chmod +x /mnt/sys/usr/bin/opkg

          # 检查是否有 apk（新版 OpenWrt 换了包管理器）
          if [ -f /tmp/owrt/sbin/apk ] || [ -f /tmp/owrt/usr/bin/apk ]; then
              echo "NOTE: this OpenWrt rootfs also contains apk"
          fi

          # ---- 删 su ----
          sudo find /mnt/sys -name su -type l -delete
          sudo rm -f /mnt/sys/bin/su /mnt/sys/sbin/su /mnt/sys/usr/bin/su

          # ---- 账户：root 不能登录 ----
          sudo tee /mnt/sys/etc/passwd > /dev/null <<'EOF'
          root:x:0:0:root:/root:/sbin/nologin
          user:x:1000:1000:user:/home/user:/bin/sh
          EOF

          sudo tee /mnt/sys/etc/group > /dev/null <<'EOF'
          root:x:0:
          user:x:1000:
          EOF

          sudo tee /mnt/sys/etc/shadow > /dev/null <<'EOF'
          root:*:0:0:99999:7:::
          user:*:1000:0:99999:7:::
          EOF
          sudo chmod 600 /mnt/sys/etc/shadow

          sudo tee /mnt/sys/etc/securetty > /dev/null < /dev/null

          sudo tee /mnt/sys/etc/profile > /dev/null <<'PROFILEEOF'
          export PATH=/opt/usr/bin:/opt/bin:/usr/bin:/bin
          export LD_LIBRARY_PATH=/opt/usr/lib:/opt/lib:/usr/lib:/lib
          export HOME=/home/user
          export PS1='\u@\h:\w\$ '
          PROFILEEOF

          # ---- opkg 装到 /data/opt ----
          sudo mkdir -p /mnt/sys/etc/opkg
          sudo tee /mnt/sys/etc/opkg.conf > /dev/null <<'OPKGEOF'
          dest root /data/opt
          dest ram /tmp
          lists_dir ext /data/var/opkg-lists

          src/gz openwrt_base http://downloads.openwrt.org/releases/23.05.2/packages/x86_64/base
          src/gz openwrt_packages http://downloads.openwrt.org/releases/23.05.2/packages/x86_64/packages
          src/gz openwrt_targets http://downloads.openwrt.org/releases/23.05.2/targets/x86/64/packages
          OPKGEOF

          # ---- /var 可变目录软链到 /data ----
          sudo rm -rf /mnt/sys/var/lock /mnt/sys/var/run /mnt/sys/var/log /mnt/sys/var/opkg-lists
          sudo ln -sf /data/var/lock       /mnt/sys/var/lock
          sudo ln -sf /data/var/run        /mnt/sys/var/run
          sudo ln -sf /data/var/log        /mnt/sys/var/log
          sudo ln -sf /data/var/opkg-lists /mnt/sys/var/opkg-lists

          sudo rm -f /mnt/sys/etc/resolv.conf
          sudo ln -sf /data/var/resolv.conf /mnt/sys/etc/resolv.conf

          # ---- /sbin/init ----
          sudo rm -f /mnt/sys/sbin/init
          sudo tee /mnt/sys/sbin/init > /dev/null <<'INITEOF'
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs devtmpfs /dev

          hostname tinylinux

          mkdir -p /data
          mount /dev/vdb /data

          mkdir -p /data/var/lock /data/var/run /data/var/log /data/var/opkg-lists \
                   /data/opt /data/home/user /data/tmp
          chown 1000:1000 /data/opt /data/home/user
          chmod 777 /data/var/lock /data/var/run /data/var/log
          chown 1000:1000 /data/var/opkg-lists
          touch /data/var/resolv.conf
          chmod 666 /data/var/resolv.conf

          mount --bind /data/home /home
          mount --bind /data/opt  /opt
          mount -t tmpfs tmpfs /tmp
          chmod 1777 /tmp

          ip link set eth0 up 2>/dev/null
          udhcpc -i eth0 -q -n -t 3 2>/dev/null

          export PATH=/opt/usr/bin:/opt/bin:/usr/bin:/bin
          export LD_LIBRARY_PATH=/opt/usr/lib:/opt/lib:/usr/lib:/lib
          export HOME=/home/user
          export PS1='user@tinylinux:\w\$ '

          echo
          echo "Welcome to Tiny Linux (root disabled, integrity verified)"
          echo

          exec </dev/ttyS0 >/dev/ttyS0 2>&1
          exec /bin/busybox setsid /bin/busybox setuidgid 1000 \
               /bin/busybox cttyhack /bin/sh
          INITEOF
          sudo chmod +x /mnt/sys/sbin/init

          sudo chown -R 0:0 /mnt/sys
          sudo chown -R 1000:1000 /mnt/sys/home/user
          sudo chmod u-s /mnt/sys/bin/busybox
          sudo chmod u-s /mnt/sys/usr/bin/opkg

          # ============ 生成完整性清单 ============
          echo ">>> 生成 system integrity manifest..."
          cd /mnt/sys
          sudo find . -type f \
              -not -path './proc/*' -not -path './sys/*' -not -path './dev/*' \
              -not -path './tmp/*' -not -path './data/*' \
              -not -path './var/run/*' -not -path './var/lock/*' \
              -not -path './var/log/*' -not -path './var/opkg-lists/*' \
              -not -path './home/*' -not -path './opt/*' -not -path './root/*' \
              | LC_ALL=C sort | while read f; do
              f2="${f#./}"
              h=$(sudo sha256sum "$f" | cut -d' ' -f1)
              echo "F $h /$f2"
          done | sudo tee /tmp/system.manifest > /dev/null

          sudo find . -type l \
              -not -path './proc/*' -not -path './sys/*' -not -path './dev/*' \
              -not -path './tmp/*' -not -path './data/*' \
              -not -path './var/run' -not -path './var/lock' \
              -not -path './var/log' -not -path './var/opkg-lists' \
              -not -path './home' -not -path './opt' \
              | LC_ALL=C sort | while read f; do
              f2="${f#./}"
              t=$(sudo readlink "$f")
              echo "L $t /$f2"
          done | sudo tee -a /tmp/system.manifest > /dev/null

          echo "Manifest lines: $(wc -l < /tmp/system.manifest)"
          head -5 /tmp/system.manifest

          sudo umount /mnt/sys

      # ==================== initramfs（内嵌校验）====================
      - name: Build initramfs with verifier
        run: |
          set -e
          rm -rf initramfs
          mkdir -p initramfs/{bin,dev,proc,sys,mnt,sysroot,tmp}

          cp busybox-1.36.1/_install/bin/busybox initramfs/bin/
          cp /tmp/system.manifest initramfs/system.manifest

          cd initramfs/bin
          for c in sh mount umount sha256sum readlink grep cut sort diff find \
                   cat echo sleep poweroff switch_root mkdir head cmp sed; do
            ln -sf busybox $c
          done
          cd ../..

          cat > initramfs/init <<'INITEOF'
          #!/bin/busybox sh
          /bin/busybox mount -t proc none /proc
          /bin/busybox mount -t sysfs none /sys
          /bin/busybox mount -t devtmpfs devtmpfs /dev

          echo
          echo "=== Tiny Linux Secure Boot ==="
          echo "Mounting system (read-only)..."
          if ! /bin/busybox mount -o ro /dev/vda /sysroot; then
              echo "FATAL: cannot mount /dev/vda"
              /bin/busybox sleep 3
              /bin/busybox poweroff -f
              while true; do /bin/busybox sleep 3600; done
          fi

          echo "Verifying integrity..."

          FAIL=0

          while IFS=' ' read -r type val path; do
              [ -z "$type" ] && continue
              case "$type" in
                  F)
                      actual=$(/bin/busybox sha256sum "/sysroot$path" 2>/dev/null | /bin/busybox cut -d' ' -f1)
                      if [ "$actual" != "$val" ]; then
                          echo "  TAMPERED FILE: $path"
                          FAIL=1
                      fi
                      ;;
                  L)
                      actual=$(/bin/busybox readlink "/sysroot$path" 2>/dev/null)
                      if [ "$actual" != "$val" ]; then
                          echo "  TAMPERED LINK: $path"
                          FAIL=1
                      fi
                      ;;
              esac
          done < /system.manifest

          cd /sysroot
          /bin/busybox find . -type f \
              -not -path './proc/*' -not -path './sys/*' -not -path './dev/*' \
              -not -path './tmp/*' -not -path './data/*' \
              -not -path './var/run/*' -not -path './var/lock/*' \
              -not -path './var/log/*' -not -path './var/opkg-lists/*' \
              -not -path './home/*' -not -path './opt/*' -not -path './root/*' \
              | LC_ALL=C /bin/busybox sort > /tmp/current.list

          /bin/busybox grep '^F ' /system.manifest \
              | /bin/busybox cut -d' ' -f3 \
              | /bin/busybox sed 's|^/|./|' \
              | LC_ALL=C /bin/busybox sort > /tmp/expected.list

          if ! /bin/busybox cmp -s /tmp/current.list /tmp/expected.list; then
              echo "  EXTRA OR MISSING FILES:"
              /bin/busybox diff /tmp/current.list /tmp/expected.list | /bin/busybox head -10
              FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
              echo
              echo "######################################"
              echo "#  SYSTEM INTEGRITY CHECK FAILED     #"
              echo "#  System has been tampered with.    #"
              echo "#  REFUSING TO BOOT.                 #"
              echo "#  SHUTTING DOWN.                    #"
              echo "######################################"
              echo
              /bin/busybox sleep 5
              /bin/busybox poweroff -f
              while true; do /bin/busybox sleep 3600; done
          fi

          echo "Integrity OK."
          echo

          /bin/busybox mkdir -p /sysroot/data
          /bin/busybox mount /dev/vdb /sysroot/data || echo "WARN: userdata mount failed"

          /bin/busybox mount --move /proc /sysroot/proc
          /bin/busybox mount --move /sys  /sysroot/sys
          /bin/busybox mount --move /dev  /sysroot/dev

          exec /bin/busybox switch_root /sysroot /sbin/init
          INITEOF
          chmod +x initramfs/init

          echo ">>> initramfs built:"
          ls -la initramfs/
          ls -l initramfs/init

      # ==================== 内核（嵌 initramfs）====================
      - name: Download kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.1.tar.xz
          tar -xf linux-6.6.1.tar.xz

      - name: Configure kernel
        run: |
          cd linux-6.6.1
          make defconfig
          scripts/config --disable MODULE_SIG
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          scripts/config --enable EXT4_FS
          scripts/config --enable VFAT_FS
          scripts/config --enable VIRTIO
          scripts/config --enable VIRTIO_PCI
          scripts/config --enable VIRTIO_BLK
          scripts/config --enable VIRTIO_NET
          scripts/config --enable E1000
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT

          scripts/config --enable BLK_DEV_INITRD
          scripts/config --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/initramfs"

          scripts/config --enable CMDLINE_BOOL
          scripts/config --set-str CMDLINE "rdinit=/init console=ttyS0 loglevel=7 panic=10"
          scripts/config --enable CMDLINE_OVERRIDE

          scripts/config --enable PANIC_ON_OOPS
          scripts/config --disable BOOTPARAM_SOFTLOCKUP_PANIC

          make olddefconfig

      - name: Build kernel
        run: |
          cd linux-6.6.1
          make -j$(nproc) bzImage

      # ==================== userdata.img ====================
      - name: Build userdata image
        run: |
          set -e
          dd if=/dev/zero of=userdata.img bs=1M count=1024
          mkfs.ext4 -F userdata.img
          sudo mkdir -p /mnt/data
          sudo mount -o loop userdata.img /mnt/data

          sudo mkdir -p /mnt/data/opt /mnt/data/home/user \
                        /mnt/data/var/lock /mnt/data/var/run \
                        /mnt/data/var/log /mnt/data/var/opkg-lists \
                        /mnt/data/tmp

          sudo chown -R 1000:1000 /mnt/data/opt /mnt/data/home/user
          sudo chown -R 1000:1000 /mnt/data/var/opkg-lists
          sudo chmod 777 /mnt/data/var/lock /mnt/data/var/run /mnt/data/var/log
          sudo chmod 1777 /mnt/data/tmp

          sudo touch /mnt/data/var/resolv.conf
          sudo chmod 666 /mnt/data/var/resolv.conf

          sudo umount /mnt/data

      # ==================== 产物 ====================
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp linux-6.6.1/arch/x86/boot/bzImage out/
          cp system.img out/
          cp userdata.img out/
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-linux-secure
          path: out/