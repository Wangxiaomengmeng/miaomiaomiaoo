name: Build Tiny Linux for QEMU with opkg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev cpio wget xz-utils e2fsprogs

      # ==================== BusyBox ====================
      - name: Download busybox
        run: |
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xf busybox-1.36.1.tar.bz2

      - name: Build busybox static
        run: |
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          make oldconfig
          make -j$(nproc)
          make install

      # ==================== 内核 ====================
      - name: Download kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.1.tar.xz
          tar -xf linux-6.6.1.tar.xz

      - name: Configure kernel
        run: |
          cd linux-6.6.1
          make defconfig
          scripts/config --disable MODULE_SIG
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          scripts/config --enable EXT4_FS
          scripts/config --enable VFAT_FS
          scripts/config --enable VIRTIO
          scripts/config --enable VIRTIO_PCI
          scripts/config --enable VIRTIO_BLK
          scripts/config --enable VIRTIO_NET
          scripts/config --enable E1000
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          make olddefconfig

      - name: Build kernel
        run: |
          cd linux-6.6.1
          make -j$(nproc) bzImage

      # ==================== 下载 OpenWrt rootfs（提取 musl + opkg）====================
      - name: Download OpenWrt rootfs
        run: |
          cd /tmp
          wget -q -O owrt.tar.gz \
            http://downloads.openwrt.org/releases/23.05.2/targets/x86/64/openwrt-23.05.2-x86-64-rootfs.tar.gz
          mkdir -p owrt
          tar -xzf owrt.tar.gz -C owrt
          ls -l /tmp/owrt/usr/bin/opkg
          ls -l /tmp/owrt/lib/

      # ==================== system.img（只读系统）====================
      - name: Build system image
        run: |
          set -e
          dd if=/dev/zero of=system.img bs=1M count=256
          mkfs.ext4 -F system.img
          sudo mkdir -p /mnt/sys
          sudo mount -o loop system.img /mnt/sys

          # ---- BusyBox 用户空间 ----
          sudo cp -a busybox-1.36.1/_install/* /mnt/sys/

          # ---- 必要目录 ----
          sudo mkdir -p /mnt/sys/{proc,sys,dev,etc,sbin,usr/bin,usr/lib,usr/share/udhcpc,var,lib,home,opt,root}

          # ---- udhcpc 脚本（自动配 IP）----
          sudo cp busybox-1.36.1/examples/udhcp/simple.script \
                  /mnt/sys/usr/share/udhcpc/default.script
          sudo chmod +x /mnt/sys/usr/share/udhcpc/default.script

          # ---- musl 动态库（从 OpenWrt rootfs 抠）----
          sudo cp -a /tmp/owrt/lib/*.so* /mnt/sys/lib/ 2>/dev/null || true
          sudo cp -a /tmp/owrt/usr/lib/*.so* /mnt/sys/usr/lib/ 2>/dev/null || true

          # ---- 修动态链接器软链（关键！musl 的 libc 就是链接器）----
          sudo rm -f /mnt/sys/lib/ld-musl-x86_64.so.1
          sudo ln -sf /lib/libc.so /mnt/sys/lib/ld-musl-x86_64.so.1

          # ---- opkg 二进制 ----
          sudo cp /tmp/owrt/usr/bin/opkg /mnt/sys/usr/bin/opkg
          sudo chmod +x /mnt/sys/usr/bin/opkg

          # ---- 用户账户 ----
          sudo tee /mnt/sys/etc/passwd > /dev/null <<'EOF'
          root:x:0:0:root:/root:/bin/sh
          user:x:1000:1000:user:/home/user:/bin/sh
          EOF

          sudo tee /mnt/sys/etc/group > /dev/null <<'EOF'
          root:x:0:
          user:x:1000:
          EOF

          sudo tee /mnt/sys/etc/shadow > /dev/null <<'EOF'
          root::0:0:99999:7:::
          user::1000:0:99999:7:::
          EOF
          sudo chmod 600 /mnt/sys/etc/shadow

          sudo tee /mnt/sys/etc/securetty > /dev/null <<'EOF'
          ttyS0
          tty1
          console
          EOF

          # ---- /etc/profile：PATH 指向 /opt（user 装的东西放这里）----
          sudo tee /mnt/sys/etc/profile > /dev/null <<'PROFILEEOF'
          export PATH=/opt/usr/bin:/opt/bin:/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/opt/usr/lib:/opt/lib:/usr/lib:/lib
          export HOME=/home/user
          export PS1='\u@\h:\w\$ '
          PROFILEEOF

          # ---- opkg 配置：装到 /data/opt，lists/lock 也走 /data ----
          sudo mkdir -p /mnt/sys/etc/opkg
          sudo tee /mnt/sys/etc/opkg.conf > /dev/null <<'OPKGEOF'
          dest root /data/opt
          dest ram /tmp
          lists_dir ext /data/var/opkg-lists

          src/gz openwrt_base http://downloads.openwrt.org/releases/23.05.2/packages/x86_64/base
          src/gz openwrt_packages http://downloads.openwrt.org/releases/23.05.2/packages/x86_64/packages
          src/gz openwrt_targets http://downloads.openwrt.org/releases/23.05.2/targets/x86/64/packages
          OPKGEOF

          # ---- /sbin/init ----
          sudo rm -f /mnt/sys/sbin/init
          sudo tee /mnt/sys/sbin/init > /dev/null <<'INITEOF'
          #!/bin/sh

          mount -t proc none /proc
          mount -t sysfs none /sys

          hostname tinylinux

          # 挂 userdata
          mkdir -p /data
          mount /dev/vdb /data

          # userdata 里的必备目录（首次启动可能空）
          mkdir -p /data/var/lock /data/var/opkg-lists \
                   /data/opt /data/home/user /data/tmp
          chown 1000:1000 /data/opt /data/home/user 2>/dev/null
          chmod 777 /data/var/lock /data/var/opkg-lists

          # 把可变目录挂/链到系统里
          rm -rf /var/lock /var/opkg-lists
          ln -sf /data/var/lock /var/lock
          ln -sf /data/var/opkg-lists /var/opkg-lists

          mount --bind /data/home /home
          mount --bind /data/opt /opt
          mount -t tmpfs tmpfs /tmp

          # 联网
          ip link set eth0 up 2>/dev/null
          udhcpc -i eth0 -q -n -t 3 2>/dev/null

          echo
          echo "Welcome to Tiny Linux"
          echo

          exec </dev/ttyS0 >/dev/ttyS0 2>&1
          exec /bin/busybox setsid /bin/busybox cttyhack /bin/login
          INITEOF
          sudo chmod +x /mnt/sys/sbin/init

          # ---- 权限收尾 ----
          sudo chown -R 0:0 /mnt/sys
          sudo chown -R 1000:1000 /mnt/sys/home/user
          sudo chmod u+s /mnt/sys/bin/busybox

          sudo umount /mnt/sys

      # ==================== userdata.img（可写用户数据）====================
      - name: Build userdata image
        run: |
          set -e
          dd if=/dev/zero of=userdata.img bs=1M count=1024
          mkfs.ext4 -F userdata.img
          sudo mkdir -p /mnt/data
          sudo mount -o loop userdata.img /mnt/data

          sudo mkdir -p /mnt/data/opt \
                        /mnt/data/home/user \
                        /mnt/data/var/lock \
                        /mnt/data/var/opkg-lists \
                        /mnt/data/tmp

          # /opt 和 /home/user 归 user
          sudo chown -R 1000:1000 /mnt/data/opt /mnt/data/home/user
          # opkg 的锁目录和索引目录也归 user，这样 user 能 opkg update
          sudo chown -R 1000:1000 /mnt/data/var/lock /mnt/data/var/opkg-lists

          sudo umount /mnt/data

      # ==================== 收集产物 ====================
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp linux-6.6.1/arch/x86/boot/bzImage out/
          cp system.img out/
          cp userdata.img out/
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: tiny-linux-qemu-opkg
          path: out/