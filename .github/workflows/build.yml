name: Build Tiny Linux

on:
  workflow_dispatch:        # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev cpio wget xz-utils

      - name: Download kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.1.tar.xz
          tar -xf linux-6.6.1.tar.xz

      - name: Configure kernel
        run: |
          cd linux-6.6.1
          make defconfig
          scripts/config --disable MODULE_SIG
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          make olddefconfig

      - name: Build kernel
        run: |
          cd linux-6.6.1
          make -j$(nproc) bzImage

      - name: Download busybox
        run: |
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xf busybox-1.36.1.tar.bz2

      - name: Build busybox static
        run: |
          cd busybox-1.36.1
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make oldconfig
          make -j$(nproc)
          make install

      - name: Make initramfs
        run: |
          mkdir -p initramfs
          cp -a busybox-1.36.1/_install/* initramfs/
          mkdir -p initramfs/{proc,sys,dev,tmp,etc,root}
          cat > initramfs/init <<'EOF'
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs devtmpfs /dev
          echo
          echo "Welcome to Tiny Linux"
          echo
          exec /bin/sh
          EOF
          chmod +x initramfs/init
          cd initramfs
          find . -print0 | cpio --null -o --format=newc | gzip -9 > ../initramfs.cpio.gz

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp linux-6.6.1/arch/x86/boot/bzImage out/
          cp initramfs.cpio.gz out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiny-linux
          path: out/